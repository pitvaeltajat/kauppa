# Local development database. Run `docker compose up -d postgres` to start it
# on port 5437 (Klapi uses 5432 and Budu 5436, so the three can run side by side).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kauppa
      POSTGRES_PASSWORD: kauppa
      POSTGRES_DB: kauppa
    ports:
      - "5437:5432"
    volumes:
      - kauppa_pgdata:/var/lib/postgresql/data

volumes:
  kauppa_pgdata:
